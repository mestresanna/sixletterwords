spring.application.name=six-letter-words

# H2 - file-based so results persist; overridden by SPRING_DATASOURCE_URL in docker-compose.yml
spring.datasource.url=jdbc:h2:file:./data/sixletterwords
spring.datasource.username=sa
spring.datasource.password=sa

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 web console (demo only - web-allow-others is needed inside Docker)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Your own debug logs
logging.level.be.anna.sixletterwords=DEBUG
# Spring lists every endpoint it registered at startup
logging.level._org.springframework.web.servlet.HandlerMapping.Mappings=DEBUG