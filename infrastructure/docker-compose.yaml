services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/sixletterwords
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: sa
    volumes:
      - h2-data:/data
    restart: unless-stopped

volumes:
  h2-data: